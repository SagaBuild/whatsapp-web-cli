<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="384" viewBox="0 0 1280 384" role="img" aria-labelledby="title description">
  <title id="title">WhatsApp Web CLI</title>
  <desc id="description">WhatsApp Web for your terminal. A local profile, background Chrome and original files. An illustrative terminal shows an authenticated background session.</desc>
  <rect width="1280" height="384" rx="20" fill="#0b211b"/>
  <rect x="1" y="1" width="1278" height="382" rx="19" fill="none" stroke="#26493d"/>
  <path d="M790 0v384M0 322h1280" stroke="#1b3a2e"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="56" y="54" font-size="13" letter-spacing="3" fill="#9cceba">SAGABUILD / OPEN SOURCE</text>
    <text x="52" y="136" font-size="63" font-weight="700" letter-spacing="-2" fill="#f0f9f4">WhatsApp Web</text>
    <text x="52" y="207" font-size="63" font-weight="700" letter-spacing="-2" fill="#81e5ac">for your terminal.</text>
    <text x="56" y="264" font-size="22" fill="#b6cbc2">Link once. Work in the background.</text>
    <circle cx="62" cy="353" r="4" fill="#81e5ac"/>
    <text x="78" y="359" font-size="16" fill="#d3e5db">Local profile</text>
    <circle cx="238" cy="353" r="4" fill="#81e5ac"/>
    <text x="254" y="359" font-size="16" fill="#d3e5db">Original files</text>
    <circle cx="418" cy="353" r="4" fill="#81e5ac"/>
    <text x="434" y="359" font-size="16" fill="#d3e5db">Codex skill</text>
    <text x="1218" y="359" text-anchor="end" font-size="13" letter-spacing="2" fill="#87a99a">WHATSAPP-WEB-CLI</text>
  </g>
  <rect x="834" y="64" width="388" height="218" rx="12" fill="#102a22" stroke="#365746"/>
  <path d="M834 104h388" stroke="#365746"/>
  <circle cx="854" cy="85" r="4" fill="#527361"/>
  <circle cx="870" cy="85" r="4" fill="#527361"/>
  <circle cx="886" cy="85" r="4" fill="#527361"/>
  <g font-family="Consolas, Menlo, monospace" font-size="14">
    <text x="1202" y="90" text-anchor="end" fill="#91b39e">local session</text>
    <text x="854" y="133" fill="#cce5d5">$ node scripts/wa.mjs open</text>
    <text x="854" y="163" fill="#91b39e">{ <tspan fill="#beeacd">"ok"</tspan>: <tspan fill="#81e5ac">true</tspan>,</text>
    <text x="872" y="189" fill="#91b39e"><tspan fill="#beeacd">"data"</tspan>: {</text>
    <text x="890" y="215" fill="#91b39e"><tspan fill="#beeacd">"authenticated"</tspan>: <tspan fill="#81e5ac">true</tspan>,</text>
    <text x="890" y="241" fill="#91b39e"><tspan fill="#beeacd">"headed"</tspan>: <tspan fill="#81e5ac">false</tspan></text>
    <text x="854" y="267" fill="#91b39e">} }</text>
  </g>
</svg>
